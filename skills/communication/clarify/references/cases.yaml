# Maintainer-only comparison cases for the clarify skill.
# Review fields are expectations, not extra user messages.
version: "2.0"
cases:
  - id: explicit-idea-and-rephrase
    input:
      messages:
        - role: user
          content: "我知道大概想要什么，但说不清。帮我解释一下我的意思，再写成一句我能直接发给开发者的话。"
    review:
      expect: "Briefly explains the inferred intent, then writes a clear first-person request that preserves uncertainty and is ready to reuse. Stops after delivering it."
      avoid: "Starting implementation, asking a long list of requirements questions, or inventing technical choices."

  - id: implicit-rejected-guess
    input:
      messages:
        - role: user
          content: "这个列表想要不那么乱，有重点。"
        - role: assistant
          content: "我会把间距加大、卡片变圆。"
        - role: user
          content: "不是视觉上的松散。我说的重点是内容的先后，但我也说不清。"
    review:
      expect: "Explains that the user means information order or hierarchy, then offers a clearer first-person wording about prioritizing content."
      avoid: "Repeating spacing advice, redesigning the list, or turning the exchange into a requirements interview."

  - id: colloquial-but-actionable
    input:
      messages:
        - role: user
          content: "把这个登录按钮弄大点，手机上不好点；字号先别动。"
    review:
      expect: "Does not invoke clarify; the request is already actionable."
      avoid: "Asking the user to choose between touch target, padding, typography, and accessibility terminology."

  - id: existing-term-explanation
    input:
      messages:
        - role: user
          content: "代码审查里说的幂等是什么意思？拿重试支付请求举例解释。"
    review:
      expect: "Explains the existing term in context; this is make-sense, not clarify."
      avoid: "Rephrasing the user's clear question as if they could not express it."

  - id: improve-user-position-without-taking-over
    input:
      messages:
        - role: user
          content: "做个新的 skill，主要就是按用户要求去 skills.sh、GitHub 这些地方找合适的 skills 放进项目级 skills。"
    review:
      expect: "Explains the goal as finding existing Skills from relevant sources and placing suitable ones in the current project's Skills directory; drafts a polished first-person request and stops for the user's adoption or correction."
      avoid: "Choosing search/install policy, target agent, scoring rules, or implementation details without evidence; creating the Skill immediately."

  - id: essential-gap
    input:
      messages:
        - role: user
          content: "我想把误删的笔记找回来，帮我写这个按钮的说明，但我没想好它能找回刚删的，还是也能找回以前删的。"
    review:
      expect: "Explains that the button's recovery scope is undecided, then drafts wording that preserves this open choice and notes it needs resolution before final button copy."
      avoid: "Choosing which notes can be recovered, blocking the draft with a question when uncertainty can be stated, or asking a long sequence of product questions."

  - id: preserve-uncertain-detail
    input:
      messages:
        - role: user
          content: "我要一种睡醒后自动回到刚才工作状态的感觉，帮我写给开发者，但我还没想好要在哪种设备上用。"
    review:
      expect: "Explains the desired experience and writes a clear request that leaves the device unspecified."
      avoid: "Choosing an operating system, inventing a technical feature, or delaying the draft with unnecessary questions."

  - id: user-corrects-premature-action
    input:
      messages:
        - role: user
          content: "你怎么直接做了？我还没说清楚我具体想让它怎么工作。"
    review:
      expect: "Acknowledges the premature action, explains the known intent and the missing behavior choice, and offers improved wording that preserves that unresolved choice."
      avoid: "Defending the assumed behavior, continuing implementation, or immediately launching an exhaustive interview."
