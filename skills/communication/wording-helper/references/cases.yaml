# Maintainer-only comparison cases for the wording-helper skill.
# Review fields are expectations, not extra user messages.
# Topic index (search case IDs):
# - Activation: explicit-idea-and-rephrase, explicit-skill-call-review-before-answer,
#   explicit-call-task-shaped-request, explicit-call-bare-invocation,
#   implicit-rejected-guess, improve-user-position-without-taking-over
# - Review: user-confirms-wording-and-continues, approval-without-continuation,
#   user-revises-draft, user-corrects-premature-action
# - Exclusions: colloquial-but-actionable, existing-term-explanation,
#   actionable-skill-creation, visual-direction-without-wording-request
# - Uncertainty: essential-gap, preserve-uncertain-detail
# - Language and precedence: explicit-visual-wording-in-english
version: "2.1.0"
cases:
  - id: explicit-idea-and-rephrase
    input:
      messages:
        - role: user
          content: "我知道大概想要什么，但说不清。帮我解释一下我的意思，再写成一句我能直接发给开发者的话。"
    review:
      expect: "Presents a clear first-person request in a standalone txt code block, then briefly explains the inferred intent, preserving uncertainty. Waits for user review; does not proceed until the user confirms and asks to continue."
      avoid: "Starting implementation before confirmation, asking a long list of requirements questions, or inventing technical choices."

  - id: explicit-skill-call-review-before-answer
    input:
      messages:
        - role: user
          content: "请使用 wording-helper。我想看看所有 Pi 可用的 Skills 各自负责什么。"
    review:
      expect: "The first substantive content is a standalone txt code block with a directly usable first-person request; a brief intent note may follow. Does not list the Skills until the user reviews the wording and asks to continue."
      avoid: "Treating the skill call as approval to execute, returning only an unformatted paraphrase, or asking unnecessary terminology questions."

  - id: explicit-call-always-starts-with-copy-ready-text
    input:
      messages:
        - role: user
          content: "请用 wording-helper 优化这条请求：帮我看看电脑上装的 Skills 都是干什么的。"
    review:
      expect: "The first substantive response content is a standalone txt code block containing a concise, copy-ready request. It clarifies that the scope is the Skills installed on this computer and asks for each name and purpose, without answering the request or inventing extra requirements. Any explanation comes after the block."
      avoid: "An introductory paragraph before the block, a paraphrase outside a txt fence, answering the underlying request, or adding unsupported requirements."

  - id: explicit-call-task-shaped-request
    input:
      messages:
        - role: user
          content: "请使用 wording-helper。我需要你给我重新整理一份把项目里的 Skills 按用途分类并说明安装过程的方案。如果你有什么不清楚的，先来问我。"
    review:
      expect: "The first substantive content is a standalone txt code block with a first-person, copy-ready request that keeps the stated goal and any genuinely open detail. Only after the block may a short intent note and at most one focused question follow."
      avoid: "Inspecting the environment or project before drafting, asking about deliverable form, audience, scope, or pain points, turning 'ask me if unclear' into a multi-question form, producing the plan itself, or restating the skill's rules."

  - id: explicit-call-bare-invocation
    input:
      messages:
        - role: user
          content: "/wording-helper"
    review:
      expect: "Asks one focused question about what the user wants to express. This is the only case where a question replaces the txt block."
      avoid: "Drafting invented content, asking several questions, inspecting the environment, or explaining how the skill works."

  - id: explicit-analysis-only-no-wording-block
    input:
      messages:
        - role: user
          content: "请用 wording-helper，只分析这段话有哪些歧义，不要帮我改写：下周处理迁移。"
    review:
      expect: "Analyzes the ambiguity without adding a txt wording draft because the user explicitly requested analysis only."
      avoid: "Forcing a copy-ready request into a txt block despite the explicit no-rewrite instruction."

  - id: user-confirms-wording-and-continues
    input:
      messages:
        - role: user
          content: "请使用 wording-helper。我想看看所有 Pi 可用的 Skills 各自负责什么。"
        - role: assistant
          content: |-
            我理解你想查看 Pi 当前可用 Skills 的职责。可以这样说：
            ```txt
            请列出当前 Pi 可用的所有 Skills，并用简洁的话说明每个 Skill 的功能定位。
            ```
        - role: user
          content: "这就是我的意思，请按这个继续。"
    review:
      expect: "Treats the approved wording as the user's task instruction and proceeds to list the Pi Skills and their functions."
      avoid: "Asking for confirmation again, merely repeating the wording, or refusing to continue because wording-helper normally pauses."

  - id: implicit-rejected-guess
    input:
      messages:
        - role: user
          content: "这个列表想要不那么乱，有重点。"
        - role: assistant
          content: "我会把间距加大、卡片变圆。"
        - role: user
          content: "不是视觉上的松散。我说的重点是内容的先后，但我也说不清。"
    review:
      expect: "Explains that the user means information order or hierarchy, then offers a clearer first-person wording in a standalone txt code block. Waits for the user's review."
      avoid: "Repeating spacing advice, redesigning the list, or turning the exchange into a requirements interview."

  - id: colloquial-but-actionable
    input:
      messages:
        - role: user
          content: "把这个登录按钮弄大点，手机上不好点；字号先别动。"
    review:
      expect: "Does not invoke wording-helper; the request is already actionable."
      avoid: "Asking the user to choose between touch target, padding, typography, and accessibility terminology."

  - id: existing-term-explanation
    input:
      messages:
        - role: user
          content: "代码审查里说的幂等是什么意思？拿重试支付请求举例解释。"
    review:
      expect: "Explains the existing term in context instead of invoking wording clarification."
      avoid: "Rephrasing the user's clear question as if they could not express it."

  - id: improve-user-position-without-taking-over
    input:
      messages:
        - role: user
          content: "请用 wording-helper 整理这段话：做个新的 skill，主要就是按用户要求去 skills.sh、GitHub 这些地方找合适的 skills 放进项目级 skills。"
    review:
      expect: "Explains the goal as finding existing Skills from relevant sources and placing suitable ones in the current project's Skills directory; drafts a polished first-person request in a standalone txt code block and waits for the user's review."
      avoid: "Choosing search/install policy, target agent, scoring rules, or implementation details without evidence; creating the Skill before user confirmation."

  - id: essential-gap
    input:
      messages:
        - role: user
          content: "我想把误删的笔记找回来，帮我写这个按钮的说明，但我没想好它能找回刚删的，还是也能找回以前删的。"
    review:
      expect: "Explains that the button's recovery scope is undecided, then drafts copy in a standalone txt code block that preserves the open choice and notes it needs resolution before final button copy. Waits for review."
      avoid: "Choosing which notes can be recovered, blocking the draft with a question when uncertainty can be stated, or asking a long sequence of product questions."

  - id: preserve-uncertain-detail
    input:
      messages:
        - role: user
          content: "我要一种睡醒后自动回到刚才工作状态的感觉，帮我写给开发者，但我还没想好要在哪种设备上用。"
    review:
      expect: "Explains the desired experience and writes a clear request in a standalone txt code block that leaves the device unspecified. Waits for the user's review."
      avoid: "Choosing an operating system, inventing a technical feature, or delaying the draft with unnecessary questions."

  - id: user-corrects-premature-action
    input:
      messages:
        - role: user
          content: "你怎么直接做了？我还没说清楚我具体想让它怎么工作。"
    review:
      expect: "Acknowledges the premature action, explains the known intent and the missing behavior choice, then offers wording in a standalone txt code block that preserves that unresolved choice. Waits for the user's review before resuming."
      avoid: "Defending the assumed behavior, continuing implementation, or immediately launching an exhaustive interview."

  - id: approval-without-continuation
    input:
      messages:
        - role: user
          content: "请用 wording-helper 整理：列出项目里可用的 Skills。"
        - role: assistant
          content: |-
            我理解你想查看项目里的 Skills。可以这样说：
            ```txt
            请列出当前项目可用的 Skills，并说明各自的用途。
            ```
        - role: user
          content: "这就是我的意思。"
    review:
      expect: "Acknowledges the wording approval without executing or drafting it again."
      avoid: "Listing Skills, inspecting the project, or treating wording approval as permission to act."

  - id: user-revises-draft
    input:
      messages:
        - role: user
          content: "请用 wording-helper 整理：列出项目里可用的 Skills。"
        - role: assistant
          content: |-
            可以这样说：
            ```txt
            请列出当前项目可用的 Skills，并说明各自的用途。
            ```
        - role: user
          content: "只看视频相关的，先改话术。"
    review:
      expect: "Revises the draft to cover video Skills only, uses a standalone txt block, and waits for review."
      avoid: "Executing the revised task, keeping the broader scope, or treating a correction as approval."

  - id: actionable-skill-creation
    input:
      messages:
        - role: user
          content: "做个新的 skill，主要就是按用户要求去 skills.sh、GitHub 这些地方找合适的 skills 放进项目级 skills。"
    review:
      expect: "Does not invoke wording-helper. Handles the Skill creation request under the normal task workflow."
      avoid: "Forcing a wording-review gate simply because the request is colloquial."

  - id: visual-direction-without-wording-request
    input:
      messages:
        - role: user
          content: "这个页面太素了，我想要像 Linear 那样有质感，给我几个设计方向。"
    review:
      expect: "Handles the request as a visual design-direction task rather than starting wording review."
      avoid: "Rewriting the request in a txt block and waiting for approval instead of addressing the design task."

  - id: explicit-visual-wording-in-english
    input:
      messages:
        - role: user
          content: "请用 wording-helper，帮我用英文写给设计师：页面要有质感，像 Linear，但具体怎么做还没定。"
    review:
      expect: "Explains the intent in Chinese, drafts English wording in a standalone txt block, preserves undecided design details, and waits for review."
      avoid: "Routing directly into design execution, drafting in Chinese, or inventing colors, typography, and implementation choices."
